[package]
name = "darkbio_crypto_ffi"
version = "0.21.0"
edition = "2024"
license = "BSD-3-Clause"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
darkbio-crypto = { version = "0.21.0", features = ["argon2", "cbor", "cose", "cwt", "hkdf", "rand", "rsa", "stream", "xdsa", "xhpke"] }
flutter_rust_bridge = "=2.13.0"
zeroize = "1.9.2"

[profile.release]
lto = true
opt-level = "z"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
